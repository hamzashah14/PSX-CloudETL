apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
stringData: 
  # WARNING: Do not store plaintext secrets in version control.
  # These are placeholders. In production, use SealedSecrets or External Secrets Operator.
  POSTGRES_DB: etldb
  POSTGRES_USER: etluser
  POSTGRES_PASSWORD: "CHANGE_ME_PRODUCTION_SECURE_PASSWORD"
  DATABASE_URL: "postgresql://etluser:CHANGE_ME_PRODUCTION_SECURE_PASSWORD@postgres.database.svc.cluster.local:5432/etldb"

