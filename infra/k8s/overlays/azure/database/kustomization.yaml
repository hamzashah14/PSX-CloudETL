apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Azure Kubernetes Service. The volume uses the cluster's default storage class (Azure Disk).
# Azure disks come with a lost+found folder in the root, which stops initdb, so the data directory
# is a sub-folder of the mount.
resources:
  - ../../../base/database
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
        namespace: database
      spec:
        template:
          spec:
            containers:
              - name: postgres
                env:
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
