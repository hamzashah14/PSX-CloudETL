apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-deployment
  labels:
    app: scheduler
spec:
  replicas: 1  # must stay a single copy: it starts a pipeline run every 30 s
  strategy:
    type: Recreate  # never run the old and the new scheduler side by side during a rollout
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: psx-etl-scheduler:latest
        ports:
        - containerPort: 8004
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          runAsUser: 1000
        env:
        - name: EXTRACT_SERVICE_URL
          value: "http://extract-service:8000"
        - name: TRANSFORM_SERVICE_URL
          value: "http://transform-service:8001"
        - name: VISUALIZATION_SERVICE_URL
          value: "http://visualization-service:8002"
        - name: LOAD_SERVICE_URL
          value: "http://load-service:8003"
