# CPU-based autoscaling for the stateless services. The scheduler is deliberately NOT scaled:
# it starts a pipeline run every 30 seconds, so a second copy would double every run.
# Needs metrics-server (IBM Cloud Kubernetes Service and AKS both install it) and the CPU
# requests that are set on every Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: extract-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: extract-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

